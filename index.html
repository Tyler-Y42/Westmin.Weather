<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22&gt;&lt;text y=%22.9em%22 font-size=%2290%22&gt;☀️&lt;/text&gt;&lt;/svg&gt;">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- translucent status bar blends with the page; body padding-top keeps content clear of the clock -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="manifest" href="manifest.webmanifest">
    <title>Westmin Weather</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        /* fluid root font: 16px at the 1200x800 design size, everything in rem scales with it */
        html {
            font-size: clamp(9px, min(1.333vw, 2vh), 28px);
            /* background-image, NOT the `background` shorthand: iOS paints safe-area strips with the
               root background-color only, and the shorthand would reset it to transparent (white band).
               The first layer fades the bottom edge to one flat color so the strip continues it seamlessly. */
            background-image:
                linear-gradient(to bottom, rgba(19, 40, 76, 0) 80%, rgba(19, 40, 76, 1) 100%),
                linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            background-color: #13284c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            color: #e8e8e8;
            padding: 0.75rem;
            /* keep content below the overlaid clock in standalone mode */
            padding-top: max(0.75rem, calc(env(safe-area-inset-top, 0px) + 2px));
        }
        .container {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: 1.1fr 1.1fr 2.48fr 0.54fr auto;
            gap: 0.625rem;
        }
        
        /* rows 1 and 2, three cards each */
        .temp-main { grid-column: 1 / 3; }
        .forecast-card { grid-column: 3 / 5; }
        .wind-card { grid-column: 5 / 7; }
        .aqi-card { grid-column: 1 / 3; }
        .precip-card { grid-column: 3 / 5; }
        .pressure-card { grid-column: 5 / 7; }
        
        /* row 3, both forecast charts split 50/50 */
        .forecast-graph-card { 
            grid-column: 1 / 4; 
            grid-row: 3; 
        }
        .week-forecast-card { 
            grid-column: 4 / 7; 
            grid-row: 3; 
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 0.875rem;
            padding: 0.875rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        /* Current Temp Card */
        .temp-main { display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 0; padding-bottom: 0; position: relative; container-type: size; }
        /* invisible twin of the bottom label so the ring zone is vertically symmetric in the card */
        .temp-label-spacer { visibility: hidden; }
        .temp-ring-container { position: relative; display: flex; align-items: center; justify-content: center; flex: 1 1 auto; min-height: 0; width: 100%; }
        /* ring scales to whatever space the card gives it */
        .temp-ring-svg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; overflow: visible; }
        /* sized against BOTH card dimensions so the number always fits inside the pill, first line is the fallback */
        .temp-current { font-size: 3.4rem; font-size: clamp(1.5rem, min(17.3cqw, 50cqh), 7.5rem); font-weight: 200; color: #fff; line-height: 1; position: relative; z-index: 1; }
        .temp-current a { color: #fff; text-decoration: none; }
        .temp-current a:hover { color: #74ebd5; }
        .temp-current .unit { font-size: 1.25rem; font-size: clamp(0.7rem, min(6cqw, 16.5cqh), 2.2rem); vertical-align: super; color: #74ebd5; }
        .temp-label { font-size: 0.94rem; font-size: clamp(0.6rem, 11cqh, 1.1rem); color: rgba(255, 255, 255, 0.5); text-transform: uppercase; letter-spacing: 2px; margin-top: 4px; }
        
        /* Today's Forecast Card */
        .forecast-card { display: flex; flex-direction: column; justify-content: center; gap: 4.5px; padding: 13.3px 9.1px; }
        .forecast-card .card-title { font-size: 0.95rem; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; letter-spacing: 1px; text-align: center; margin-bottom: 2px; }
        .forecast-item { display: flex; align-items: center; justify-content: space-between; }
        .forecast-item .label { font-size: 1.15rem; color: rgba(255, 255, 255, 0.6); text-transform: uppercase; letter-spacing: 1px; }
        .forecast-item .value { font-size: 2.2rem; font-weight: 300; }
        .forecast-item.high .value { color: #ff6b6b; }
        .forecast-item.low .value { color: #4ecdc4; }
        
        /* Wind Card */
        .wind-card { display: flex; flex-direction: row; align-items: stretch; padding-top: 5px; padding-bottom: 5px; }
        .wind-half { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; }
        .wind-half + .wind-half { border-left: 1px solid rgba(255, 255, 255, 0.12); }
        .wind-speed { font-size: 2.6rem; font-weight: 200; color: #fff; }
        .wind-speed .unit { font-size: 1.05rem; color: #74ebd5; }
        .wind-rh-value { font-size: 2.6rem; font-weight: 200; color: #fff; }
        .wind-rh-value .unit { font-size: 1.05rem; color: #74b9ff; }
        .wind-rh-label { font-size: 0.95rem; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; letter-spacing: 1px; }
        .wind-direction { display: flex; align-items: center; gap: 4px; }
        .wind-arrow { width: 1.9em; height: 1.9em; border: 2px solid #74ebd5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; transition: transform 0.5s ease; }
        .wind-dir-text { font-size: 1.05rem; color: #74ebd5; font-weight: 500; }
        .wind-gust { font-size: 0.95rem; color: rgba(255, 255, 255, 0.5); }
        .wind-gust span { color: #ff9f43; }
        
        /* AQI Card */
        .aqi-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4.5px; padding-top: 5px; padding-bottom: 5px; }
        .aqi-value { font-size: clamp(3.07rem, 2.63vw, 3.14rem); font-weight: 200; }
        .aqi-label { font-size: clamp(0.93rem, 0.82vw, 0.96rem); color: rgba(255, 255, 255, 0.5); text-transform: uppercase; letter-spacing: 2px; }
        .aqi-status { font-size: clamp(0.77rem, 0.62vw, 0.82rem); font-weight: 500; padding: 5px 10px; border-radius: 20px; }
        .aqi-good { background: #27ae60; color: #fff; }
        .aqi-moderate { background: #f1c40f; color: #333; }
        .aqi-sensitive { background: #e67e22; color: #fff; }
        .aqi-unhealthy { background: #e74c3c; color: #fff; }
        .aqi-very-unhealthy { background: #8e44ad; color: #fff; }
        .aqi-hazardous { background: #7b241c; color: #fff; }
        
        /* Precip Card */
        .precip-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5.1px; padding-top: 5px; padding-bottom: 5px; }
        .precip-value { font-size: clamp(3.5rem, 3vw, 3.57rem); font-weight: 200; color: #74b9ff; }
        .precip-label { font-size: clamp(1.06rem, 0.93vw, 1.105rem); color: rgba(255, 255, 255, 0.5); text-transform: uppercase; letter-spacing: 2px; }
        
        /* Pressure Card */
        .pressure-card { display: flex; flex-direction: row; align-items: stretch; gap: 0.5rem; padding-top: 2px; padding-bottom: 5px; }
        /* current value gets its own full-height slot, readable from across the room */
        .pressure-now-slot { flex: 0 0 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; padding: 0 0.3rem; }
        .pressure-value-big { font-size: 2.7rem; font-weight: 200; color: #74ebd5; line-height: 1; }
        .pressure-unit { font-size: 0.8rem; color: rgba(255, 255, 255, 0.5); letter-spacing: 1px; }
        .pressure-trend { font-size: 0.95rem; font-weight: 500; }
        .trend-up { color: #27ae60; font-weight: 700; }
        .trend-down { color: #e74c3c; font-weight: 700; }
        .trend-gentle { color: #f1c40f; }
        .trend-stable { color: rgba(255, 255, 255, 0.5); }
        .pressure-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .pressure-label { font-size: 0.8rem; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; letter-spacing: 1px; line-height: 1.1; }
        .pressure-chart-container { flex: 1; position: relative; min-height: 0; }
        
        /* Forecast Graph */
        .forecast-graph-card { display: flex; flex-direction: column; }
        .forecast-graph-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .forecast-graph-title { font-size: 1.6rem; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; letter-spacing: 1px; }
        .chart-container { flex: 1; position: relative; min-height: 0; }
        canvas { width: 100% !important; height: 100% !important; }
        
        /* 7-Day Forecast Card */
        .week-forecast-card { display: flex; flex-direction: column; padding: 0.875rem; }
        .week-chart-container { flex: 1; position: relative; min-height: 0; }
        
        /* Extra Data Row: four equal columns, each item centred in its own, so the readouts
           are evenly spaced across the card */
        .extra-data { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; align-items: center; padding: 4px 0; }
        .extra-data > .extra-item { grid-row: 1; min-width: 0; }  /* one visible row, allow shrink */
        .extra-item { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .extra-item .value { font-size: clamp(1.25rem, 1.12vw, 1.344rem); color: #fff; }
        .extra-item .label { font-size: clamp(0.81rem, 0.70vw, 0.84rem); color: rgba(255, 255, 255, 0.5); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

        /* Sunrise/sunset: arc traces the sun's daily path, dot marks where it is now */
        .sun-item { flex-direction: row; gap: 0.7rem; }
        .sun-arc { width: 7.4rem; height: 3.3rem; overflow: visible; flex: 0 0 auto; }
        .sun-times { display: flex; flex-direction: column; gap: 2px; text-align: left; line-height: 1.2; }
        .sun-times div { font-size: 1.16rem; color: #fff; white-space: nowrap; }
        .sun-times .sun-up { color: #ffd166; }
        .sun-times .sun-down { color: #9aa7ff; }
        .moon-icon { width: 2.1rem; height: 2.1rem; flex: 0 0 auto; }

        /* 24hr high/low: labels left, values right, compact */
        .hilo { width: fit-content; justify-self: center; }
        .hilo-row { display: flex; align-items: baseline; justify-content: space-between; width: 100%; gap: 0.6rem; }
        .hilo-row .label { font-size: 0.88rem; margin-top: 0; }
        .hilo-row .val { font-size: 1.4rem; font-weight: 300; }
        .hilo-row.high .val { color: #ff6b6b; }
        .hilo-row.low .val { color: #4ecdc4; }
        
        /* Footer bar: radar button, forecast phrase / alert banner, timestamp */
        .bottom-bar { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; position: relative; padding: 8px 12px; transition: background-color 0.3s ease; }
        /* max-width keeps the centred group clear of the radar button and timestamp */
        .bar-center { display: flex; align-items: center; justify-content: center; gap: 0.6rem; max-width: calc(100% - 18rem); color: rgba(255, 255, 255, 0.7); }
        /* the phrase itself links out to the NWS page for this gridpoint */
        .short-forecast { text-align: center; font-size: clamp(1.19rem, 1.05vw, 1.26rem); color: inherit; font-style: italic;
            text-decoration: none; cursor: pointer; }
        .short-forecast:hover { text-decoration: underline; text-underline-offset: 3px; }
        .update-footer { position: absolute; right: 0.9rem; font-size: 0.85rem; color: rgba(255, 255, 255, 0.3); white-space: nowrap; }
        /* "i" dot: only shown while an alert is up, opens the full advisory text */
        .alert-info { flex: 0 0 auto; width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 1.5px solid currentColor;
            background: transparent; color: inherit; font-family: inherit; font-size: 0.95rem; font-weight: 700; line-height: 1;
            cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .alert-info[hidden] { display: none; }

        /* Full advisory text sheet */
        .alert-modal { position: fixed; inset: 0; z-index: 600; background: rgba(4, 8, 18, 0.85); display: none; align-items: center; justify-content: center;
            padding: 2rem; padding-top: max(2rem, calc(env(safe-area-inset-top, 0px) + 1rem)); }
        .alert-modal.open { display: flex; }
        .alert-sheet { background: #111a2e; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 0.875rem;
            width: min(46rem, 100%); max-height: 80vh; display: flex; flex-direction: column; }
        .alert-sheet-head { display: flex; align-items: center; gap: 1rem; padding: 0.7rem 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.12); }
        .alert-sheet-head span { font-size: 1.25rem; font-weight: 600; color: #ff8073; }
        .alert-sheet-body { padding: 0.9rem 1rem; overflow-y: auto; }
        .alert-sheet-label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; color: rgba(255, 255, 255, 0.45); margin-top: 0.7rem; }
        .alert-sheet-label:first-child { margin-top: 0; }
        .alert-sheet-text { font-size: 1rem; line-height: 1.45; color: #e8e8e8; white-space: pre-wrap; }
        .alert-sheet-link { display: inline-block; margin-top: 1rem; font-size: 0.95rem; color: #74ebd5; }

        /* Radar button + fullscreen radar overlay */
        .radar-btn { position: absolute; left: 0.9rem; background: rgba(116, 235, 213, 0.12); color: #74ebd5; border: 1px solid rgba(116, 235, 213, 0.45);
            border-radius: 0.5rem; padding: 0.25rem 0.7rem; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; font-family: inherit; cursor: pointer; }
        .radar-btn:active { background: rgba(116, 235, 213, 0.28); }
        /* fixed overlays sit above the body's safe-area padding, so they clear the status bar themselves */
        .radar-modal { position: fixed; inset: 0; z-index: 500; background: #0b1020; display: none; flex-direction: column;
            padding-top: env(safe-area-inset-top, 0px); }
        .radar-modal.open { display: flex; }
        .radar-head { display: flex; align-items: center; gap: 0.8rem; padding: 0.5rem 0.9rem; background: rgba(255, 255, 255, 0.06); position: relative; }
        .radar-title { font-size: 1.1rem; color: #fff; letter-spacing: 1px; text-transform: uppercase; }
        /* frame time: centred and large so it reads at a glance while the loop plays */
        .radar-time { position: absolute; left: 50%; transform: translateX(-50%); font-size: 2.1rem; font-weight: 600;
            color: #74ebd5; font-variant-numeric: tabular-nums; line-height: 1.1; white-space: nowrap; }
        /* tile attributions sit in Leaflet's own corner control, not the header */
        .leaflet-control-attribution { background: rgba(11, 16, 32, 0.7) !important; color: rgba(255, 255, 255, 0.4) !important; font-size: 0.62rem !important; }
        .leaflet-control-attribution a { color: rgba(255, 255, 255, 0.5) !important; }

        /* dBZ legend for the NEXRAD colour ramp */
        .radar-legend { position: absolute; left: 0.9rem; bottom: 0.9rem; z-index: 1000; background: rgba(11, 16, 32, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 0.5rem; padding: 0.4rem 0.6rem; }
        .radar-legend-title { font-size: 0.7rem; color: rgba(255, 255, 255, 0.6); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
        .radar-legend-bar { display: flex; width: 15rem; height: 0.6rem; border-radius: 3px; overflow: hidden; }
        .radar-legend-bar i { flex: 1; }
        .radar-legend-labels { display: flex; justify-content: space-between; font-size: 0.68rem; color: rgba(255, 255, 255, 0.7); margin-top: 2px; font-variant-numeric: tabular-nums; }
        .radar-legend-words { display: flex; justify-content: space-between; font-size: 0.66rem; color: rgba(255, 255, 255, 0.45); }
        .radar-close { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 0.5rem; padding: 0.3rem 0.8rem; font-size: 0.95rem; font-family: inherit; cursor: pointer; }
        #radar-close { margin-left: auto; }
        #radar-slider { width: 12rem; accent-color: #74ebd5; cursor: pointer; }
        #radar-play { min-width: 2.6rem; }
        .radar-map { flex: 1; min-height: 0; background: #0b1020; }

        /* NWS alert states - outline + coloured text only; tap the bar to swap back to the forecast */
        .bottom-bar.has-alert { border-width: 2px; }
        .bottom-bar.has-alert .short-forecast { font-style: normal; font-weight: 600; }
        .bottom-bar.alert-extreme { border-color: #ff5b4a; }
        .bottom-bar.alert-extreme .bar-center { color: #ff7a68; }
        .bottom-bar.alert-severe { border-color: #e74c3c; }
        .bottom-bar.alert-severe .bar-center { color: #ff8073; }
        .bottom-bar.alert-moderate { border-color: #e67e22; }
        .bottom-bar.alert-moderate .bar-center { color: #ffa953; }
        .bottom-bar.alert-minor { border-color: #f1c40f; }
        .bottom-bar.alert-minor .bar-center { color: #ffd95e; }

        /* Phone layout: two columns that scroll instead of the fixed kiosk grid. Gated behind
           these breakpoints so iPad (1080x778) and desktop rendering are untouched. */
        @media (max-width: 700px), (max-height: 480px) and (max-width: 950px) {
            html { font-size: clamp(12px, 3.6vw, 17px); }
            html, body { overflow-y: auto; height: auto; }
            body { min-height: 100%; }
            .container { height: auto; grid-template-columns: repeat(2, 1fr); grid-template-rows: none; }
            .temp-main, .pressure-card, .forecast-graph-card, .week-forecast-card, .extra-data, .bottom-bar { grid-column: 1 / -1; }
            .forecast-card, .aqi-card { grid-column: 1 / 2; }
            .wind-card, .precip-card { grid-column: 2 / 3; }
            .forecast-graph-card, .week-forecast-card { grid-row: auto; min-height: 15rem; }
            /* fixed sizes here: the auto-height phone grid gives cq units nothing to resolve against */
            .temp-main { height: 9rem; }
            .temp-current { font-size: 4.2rem; }
            .temp-current .unit { font-size: 1.5rem; }
            .temp-label { font-size: 0.8rem; }
            /* the sun tracker needs the full width, so the extras row wraps to three lines */
            .extra-data { grid-template-columns: repeat(2, 1fr); row-gap: 0.5rem; }
            .extra-data > .extra-item { grid-row: auto; }
            .extra-data > .sun-item, .extra-data > .hilo { grid-column: 1 / -1; }
            .bottom-bar { flex-direction: column; gap: 0.35rem; }
            .radar-btn, .update-footer { position: static; }
            .bar-center { max-width: 100%; }
            /* radar controls wrap instead of overlapping in the narrow header */
            .radar-head { flex-wrap: wrap; }
            .radar-time { position: static; transform: none; order: -1; width: 100%; text-align: center; }
            #radar-slider { width: 100%; }
            .radar-legend { max-width: calc(100% - 1.8rem); }
            .radar-legend-bar { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Row 1 -->
        <div class="card temp-main">
            <div class="temp-label temp-label-spacer">Current</div>
            <div class="temp-ring-container">
                <svg class="temp-ring-svg" width="300" height="100" viewBox="0 0 300 100">
                    <rect id="temp-ring" x="12" y="6" width="276" height="88" rx="44" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.9"/>
                    <!-- hairline down the centre of the black band, only shown above 100F -->
                    <rect id="temp-ring-core" x="12" y="6" width="276" height="88" rx="44" fill="none" stroke="#8b1a1a" stroke-width="2.5" style="display:none"/>
                </svg>
                <div class="temp-current"><a id="temp-link" href="#" target="_blank"><span id="temp-now">--</span><span class="unit">°F</span></a></div>
            </div>
            <div class="temp-label" id="temp-label">Current</div>
        </div>
        <div class="card forecast-card">
            <div class="card-title">Today's Forecast</div>
            <div class="forecast-item high"><span class="label">High</span><span class="value"><span id="forecast-high">--</span>°</span></div>
            <div class="forecast-item low"><span class="label">Low</span><span class="value"><span id="forecast-low">--</span>°</span></div>
        </div>
        <div class="card wind-card">
            <div class="wind-half">
                <div class="wind-speed"><span id="wind-speed">--</span> <span class="unit">mph</span></div>
                <div class="wind-direction">
                    <div class="wind-arrow" id="wind-arrow">↑</div>
                    <span class="wind-dir-text" id="wind-dir">--</span>
                </div>
                <div class="wind-gust">Gusts: <span id="wind-gust">--</span> mph</div>
            </div>
            <div class="wind-half">
                <div class="wind-rh-value"><span id="wind-humidity">--</span><span class="unit">%</span></div>
                <div class="wind-rh-label">Humidity</div>
            </div>
        </div>
        
        <!-- Row 2 -->
        <div class="card aqi-card">
            <div class="aqi-value" id="aqi-value">--</div>
            <div class="aqi-label">AQI</div>
            <div class="aqi-status" id="aqi-status">Loading</div>
        </div>
        <div class="card precip-card">
            <div class="precip-value"><span id="precip-chance">--</span>%</div>
            <div class="precip-label">Chance of Precip (12hr)</div>
        </div>
        <div class="card pressure-card">
            <div class="pressure-now-slot">
                <div class="pressure-value-big"><span id="pressure-now">--</span></div>
                <div class="pressure-unit">inHg</div>
                <div class="pressure-trend trend-stable" id="pressure-trend">--</div>
            </div>
            <div class="pressure-main">
                <div class="pressure-label">Pressure (24hr)</div>
                <div class="pressure-chart-container"><canvas id="pressure-chart"></canvas></div>
            </div>
        </div>
        
        <!-- Row 3: 12hr Forecast Graph -->
        <div class="card forecast-graph-card">
            <div class="forecast-graph-header">
                <span class="forecast-graph-title">12-Hour Forecast</span>
            </div>
            <div class="chart-container"><canvas id="forecast-chart"></canvas></div>
        </div>

        // Ring ramp: white through greys to the freeze, blue past the thaw, green peaking at 63,
        // a short yellow window, orange through the 80s, red across the 90s.
        const RING_STOPS = [
            [0,   [255, 255, 255]], [12,  [223, 229, 236]], [24,  [180, 191, 204]],
            [32,  [142, 154, 168]], [35,  [79, 163, 216]],  [45,  [43, 135, 198]],
            [52,  [20, 120, 180]],  [55,  [42, 168, 137]],  [63,  [34, 195, 34]],
            [69,  [140, 200, 42]],  [72,  [255, 217, 59]],  [77,  [255, 198, 31]],
            [82,  [255, 156, 31]],  [87,  [250, 108, 26]],  [90,  [226, 42, 22]],
            [95,  [201, 18, 16]],   [100, [170, 0, 0]]
        ];

        // Dew point comfort scale (°F): dry blue -> comfortable green -> humid orange -> oppressive red
        const DEW_STOPS = [
            [40, [143, 211, 255]], [50, [110, 231, 160]], [58, [212, 225, 87]],
            [64, [255, 183, 77]],  [70, [255, 112, 67]],  [76, [214, 40, 40]]
        ];

        // linear interpolation between the stops either side of v
        function rampColor(stops, v) {
            if (v <= stops[0][0]) return `rgb(${stops[0][1].join(',')})`;
            const last = stops[stops.length - 1];
            if (v >= last[0]) return `rgb(${last[1].join(',')})`;
            for (let i = 0; i < stops.length - 1; i++) {
                const [t0, c0] = stops[i], [t1, c1] = stops[i + 1];
                if (v >= t0 && v <= t1) {
                    const k = (v - t0) / (t1 - t0);
                    return `rgb(${c0.map((c, j) => Math.round(c + (c1[j] - c) * k)).join(',')})`;
                }
            }
            return '#fff';
        }

        function updateTempRingColor(temp) {
            const ring = document.getElementById('temp-ring');
            if (!ring || temp === null) return;

            // triple digits get their own treatment: thick black band with a dark red core
            const core = document.getElementById('temp-ring-core');
            if (temp > 100) {
                ring.setAttribute('stroke', '#000000');
                ring.setAttribute('stroke-width', '10');
                ring.setAttribute('opacity', '1');
                core.style.display = '';
                return;
            }
            core.style.display = 'none';
            ring.setAttribute('stroke-width', '6');
            ring.setAttribute('opacity', '0.9');

            ring.setAttribute('stroke', rampColor(RING_STOPS, temp));
        }

        async function fetchMesoWestData() {
            const params = new URLSearchParams({
                stid: CONFIG.MESOWEST_STATION,
                token: CONFIG.MESOWEST_TOKEN,
                recent: 1440,
                vars: 'air_temp,wind_speed,wind_gust,wind_direction,relative_humidity,altimeter',
                units: 'english'
            });
            try {
                const response = await fetch(`https://api.synopticdata.com/v2/stations/timeseries?${params}`);
                const data = await response.json();
                if (data.STATION && data.STATION.length > 0) {
                    updateWeatherDisplay(data.STATION[0]);
                }
            } catch (error) { console.error('MesoWest fetch error:', error); }
        }

        function updateWeatherDisplay(station) {
            const obs = station.OBSERVATIONS;
            let latestTemp = null, latestRH = null;

            document.getElementById('temp-link').href = `https://mesowest.utah.edu/cgi-bin/droman/meso_base_dyn.cgi?stn=${CONFIG.MESOWEST_STATION}`;

            // Show when page fetched data, not when MesoWest recorded it
            document.getElementById('update-time').textContent = `Last updated: ${new Date().toLocaleString()}`;

            if (obs.air_temp_set_1) {
                const temps = obs.air_temp_set_1.filter(t => t !== null);
                if (temps.length) {
                    const currentTemp = Math.round(temps[temps.length - 1]);
                    latestTemp = temps[temps.length - 1];
                    const hi = Math.max(...temps), lo = Math.min(...temps);
                    document.getElementById('temp-now').textContent = currentTemp;
                    document.getElementById('observed-high').textContent = Math.round(hi);
                    document.getElementById('observed-low').textContent = Math.round(lo);
                    updateTempRingColor(currentTemp);
                }
            }

            if (obs.wind_speed_set_1) {
                const w = obs.wind_speed_set_1.filter(x => x !== null);
                if (w.length) document.getElementById('wind-speed').textContent = Math.round(w[w.length - 1]);
            }
            if (obs.wind_gust_set_1) {
                const g = obs.wind_gust_set_1.filter(x => x !== null);
                if (g.length) {
                    document.getElementById('wind-gust').textContent = Math.round(g[g.length - 1]);
                    document.getElementById('peak-gust').textContent = Math.round(Math.max(...g)) + ' mph';
                }
            }
            if (obs.wind_direction_set_1) {
                const d = obs.wind_direction_set_1.filter(x => x !== null);
                if (d.length) {
                    document.getElementById('wind-arrow').style.transform = `rotate(${d[d.length-1]}deg)`;
                    document.getElementById('wind-dir').textContent = degreesToCardinal(d[d.length-1]);
                }
            }
            if (obs.relative_humidity_set_1) {
                const h = obs.relative_humidity_set_1.filter(x => x !== null);
                if (h.length) {
                    latestRH = h[h.length - 1];
                    document.getElementById('wind-humidity').textContent = Math.round(latestRH);
                }
            }

            // Dew point from temp + RH (Magnus formula, done in C then back to F)
            if (latestTemp !== null && latestRH !== null && latestRH > 0) {
                const tC = (latestTemp - 32) * 5 / 9;
                const a = 17.625, b = 243.04;
                const alpha = Math.log(latestRH / 100) + (a * tC) / (b + tC);
                const dewC = (b * alpha) / (a - alpha);
                const dewF = Math.round(dewC * 9 / 5 + 32);
                const el = document.getElementById('dew-point');
                el.textContent = dewF;
                el.parentElement.style.color = dewPointColor(dewF);
                el.parentElement.title = dewPointLabel(dewF);
            }

            const pressureField = obs.altimeter_set_1 || obs.pressure_set_1;
            if (pressureField && obs.date_time) {
                const validIndices = pressureField.map((v, i) => v !== null ? i : -1).filter(i => i >= 0);
                const p = validIndices.map(i => pressureField[i]);
                const times = validIndices.map(i => obs.date_time[i]);
                
                if (p.length) {
                    document.getElementById('pressure-now').textContent = p[p.length - 1].toFixed(2);
                    
                    // 3-hour tendency (WMO convention): compare against the obs closest to 3 hrs ago.
                    // Steady band is 0.03 inHg (~1 hPa) so the semidiurnal tide, which alone moves
                    // pressure that much in 3 hours, doesn't read as weather. Above 0.06 is a real fall.
                    const lastT = new Date(times[times.length - 1]).getTime();
                    const target = lastT - 3 * 3600 * 1000;
                    let i3 = 0;
                    for (let i = 0; i < times.length; i++) {
                        if (Math.abs(new Date(times[i]).getTime() - target) < Math.abs(new Date(times[i3]).getTime() - target)) i3 = i;
                    }
                    if (Math.abs(new Date(times[i3]).getTime() - target) < 90 * 60 * 1000) {
                        const diff3 = p[p.length - 1] - p[i3];
                        const el = document.getElementById('pressure-trend');
                        const mag = Math.abs(diff3);
                        if (mag < 0.03) {
                            el.textContent = '→ steady';
                            el.className = 'pressure-trend trend-stable';
                        } else if (mag <= 0.06) {
                            el.textContent = `${diff3 > 0 ? '↑' : '↓'} ${mag.toFixed(2)}/3hr`;
                            el.className = 'pressure-trend trend-gentle';
                        } else {
                            el.textContent = `${diff3 > 0 ? '↑↑' : '↓↓'} ${mag.toFixed(2)}/3hr`;
                            el.className = 'pressure-trend ' + (diff3 > 0 ? 'trend-up' : 'trend-down');
                        }
                    }
                    
                    // Update pressure chart - sample every ~2 hours for cleaner display
                    const step = Math.max(1, Math.floor(p.length / 12));
                    const chartTimes = [];
                    const chartValues = [];
                    for (let i = 0; i < p.length; i += step) {
                        chartTimes.push(new Date(times[i]).toLocaleTimeString([], { hour: 'numeric' }));
                        chartValues.push(p[i]);
                    }
                    // Always include latest
                    if (chartTimes[chartTimes.length - 1] !== new Date(times[times.length - 1]).toLocaleTimeString([], { hour: 'numeric' })) {
                        chartTimes.push(new Date(times[times.length - 1]).toLocaleTimeString([], { hour: 'numeric' }));
                        chartValues.push(p[p.length - 1]);
                    }
                    
                    if (pressureChart) {
                        // Fixed minimum y-span (0.30 inHg) so slope reads the same day to day:
                        // calm days look flat, frontal drops look steep
                        const dmin = Math.min(...p), dmax = Math.max(...p);
                        const span = Math.max(0.30, (dmax - dmin) * 1.1);
                        const center = (dmin + dmax) / 2;
                        pressureChart.options.scales.y.min = center - span / 2;
                        pressureChart.options.scales.y.max = center + span / 2;

                        // Normal-wobble band: +-0.03 inHg (semidiurnal tide) around the 24hr mean
                        const mean = p.reduce((a, b) => a + b, 0) / p.length;
                        pressureChart.data.datasets[1].data = chartTimes.map(() => mean + 0.03);
                        pressureChart.data.datasets[2].data = chartTimes.map(() => mean - 0.03);

                        pressureChart.data.labels = chartTimes;
                        pressureChart.data.datasets[0].data = chartValues;
                        pressureChart.update('none');
                    }
                }
            }
        }

        function dewPointColor(dp) {
            return rampColor(DEW_STOPS, dp);
        }

        function dewPointLabel(dp) {
            return dp < 50 ? 'Dry' : dp < 58 ? 'Comfortable' : dp < 64 ? 'Noticeably humid'
                : dp < 70 ? 'Humid' : dp < 76 ? 'Very humid' : 'Oppressive';
        }

        function degreesToCardinal(deg) {
            const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
            return dirs[Math.round(deg / 22.5) % 16];
        }

        async function fetchNWSForecast() {
            if (!nwsGridInfo) {
                try {
                    const r = await fetch(`https://api.weather.gov/points/${CONFIG.STATION_LAT},${CONFIG.STATION_LON}`, { headers: { 'User-Agent': 'WeatherStation/1.0' } });
                    const d = await r.json();
                    nwsGridInfo = {
                        forecastUrl: d.properties.forecast,
                        forecastHourlyUrl: d.properties.forecastHourly
                    };
                } catch (e) { console.error('NWS grid error:', e); return; }
            }

            // Fetch regular forecast for today's high/low
            try {
                const r = await fetch(nwsGridInfo.forecastUrl, { headers: { 'User-Agent': 'WeatherStation/1.0' } });
                const d = await r.json();
                if (d.properties?.periods) updateForecastDisplay(d.properties.periods);
            } catch (e) { console.error('NWS forecast error:', e); }

            // Fetch hourly forecast for the graph
            try {
                const r = await fetch(nwsGridInfo.forecastHourlyUrl, { headers: { 'User-Agent': 'WeatherStation/1.0' } });
                const d = await r.json();
                if (d.properties?.periods) updateForecastChart(d.properties.periods);
            } catch (e) { console.error('NWS hourly forecast error:', e); }
        }

        function updateForecastDisplay(periods) {
            let high = null, low = null, forecast = '';
            for (const p of periods) {
                if (p.isDaytime && high === null) {
                    high = p.temperature;
                    forecast = p.shortForecast;
                }
                if (!p.isDaytime && low === null) {
                    low = p.temperature;
                }
                if (high !== null && low !== null) break;
            }
            if (high !== null) document.getElementById('forecast-high').textContent = high;
            if (low !== null) document.getElementById('forecast-low').textContent = low;
            currentShortForecast = forecast;
            renderBottomBar();
            
            // Group periods by their own date. Pairing them two at a time assumed the list
            // starts with a daytime period, but after 6pm it starts with "Tonight", which
            // pushed every high onto the day before it.
            const byDay = new Map();
            for (const p of periods) {
                const d = new Date(p.startTime);
                const key = d.toDateString();
                if (!byDay.has(key)) byDay.set(key, { name: d.toLocaleDateString([], { weekday: 'short' }), high: null, low: null });
                const entry = byDay.get(key);
                if (p.isDaytime) entry.high = p.temperature;
                else entry.low = p.temperature;
            }
            // a day whose daylight hours have already passed has no high left to plot
            const dailyData = [...byDay.values()].filter(d => d.high !== null).slice(0, 7);
            
            if (dailyData.length > 0 && weekChart) {
                weekChart.data.labels = dailyData.map(d => d.name);
                weekChart.data.datasets[0].data = dailyData.map(d => d.high);
                weekChart.data.datasets[1].data = dailyData.map(d => d.low);
                weekChart.update('none');
            }
        }

        function updateForecastChart(periods) {
            // Get next 12 hours
            const next12 = periods.slice(0, 12);
            
            const labels = next12.map(p => {
                const time = new Date(p.startTime);
                return time.toLocaleTimeString([], { hour: 'numeric' });
            });
            
            const temps = next12.map(p => p.temperature);
            const precips = next12.map(p => p.probabilityOfPrecipitation?.value || 0);

            // Precip card: max hourly PoP over the same 12 hours the graph shows
            if (precips.length) document.getElementById('precip-chance').textContent = Math.max(...precips);

            if (forecastChart) {
                forecastChart.data.labels = labels;
                forecastChart.data.datasets[0].data = temps;
                forecastChart.data.datasets[1].data = precips;
                forecastChart.update('none');
            }
        }

        // NWS alerts: the bottom bar shows the forecast phrase normally and becomes an
        // outlined warning banner while an alert is in effect (tap it to toggle back)
        let currentShortForecast = '';
        let activeAlert = null;

        // While an alert is up it owns the bar; the forecast phrase returns once it expires.
        function renderBottomBar() {
            const bar = document.getElementById('bottom-bar');
            const el = document.getElementById('short-forecast');
            bar.className = 'card bottom-bar';
            document.getElementById('alert-info').hidden = !activeAlert;
            if (activeAlert) {
                bar.classList.add('has-alert', 'alert-' + activeAlert.cls);
                el.textContent = activeAlert.text;
            } else {
                el.textContent = currentShortForecast || 'Forecast unavailable';
            }
        }

        function enableAlertUI() {
            // no alert: the phrase links to the NWS page. During one: the phrase and the dot
            // open the advisory, which carries the link itself. The rest of the bar is inert.
            const link = document.getElementById('short-forecast');
            link.href = `https://forecast.weather.gov/MapClick.php?lat=${CONFIG.STATION_LAT}&lon=${CONFIG.STATION_LON}`;
            link.addEventListener('click', (e) => {
                e.stopPropagation();
                if (activeAlert) { e.preventDefault(); openAlertSheet(); }
            });
            document.getElementById('alert-info').addEventListener('click', openAlertSheet);
            const modal = document.getElementById('alert-modal');
            document.getElementById('alert-close').addEventListener('click', () => modal.classList.remove('open'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
        }

        // Full advisory text, built with textContent since it comes straight from the NWS feed
        function openAlertSheet() {
            if (!activeAlert || !activeAlert.detail) return;
            const d = activeAlert.detail;
            const body = document.getElementById('alert-sheet-body');
            document.getElementById('alert-sheet-title').textContent = d.event;
            body.textContent = '';
            const add = (label, text) => {
                if (!text) return;
                const h = document.createElement('div');
                h.className = 'alert-sheet-label';
                h.textContent = label;
                const p = document.createElement('div');
                p.className = 'alert-sheet-text';
                p.textContent = text;
                body.append(h, p);
            };
            add('When', d.when);
            add('Area', d.area);
            add('Details', d.description);
            add('What to do', d.instruction);
            const a = document.createElement('a');
            a.className = 'alert-sheet-link';
            a.target = '_blank';
            a.href = `https://forecast.weather.gov/MapClick.php?lat=${CONFIG.STATION_LAT}&lon=${CONFIG.STATION_LON}`;
            a.textContent = 'Open the full NWS forecast page →';
            body.append(a);
            document.getElementById('alert-modal').classList.add('open');
        }

        async function fetchAlerts() {
            try {
                const r = await fetch(`https://api.weather.gov/alerts/active?point=${CONFIG.STATION_LAT},${CONFIG.STATION_LON}`, { headers: { 'User-Agent': 'WeatherStation/1.0' } });
                const d = await r.json();
                // Only surface alerts already in effect, or starting later today - NWS "active"
                // also returns watches that don't begin for days
                const nowD = new Date();
                const feats = (d.features || []).filter(f => {
                    if (!f.properties || !f.properties.event) return false;
                    const o = f.properties.onset || f.properties.effective;
                    if (!o) return true;
                    const onsetD = new Date(o);
                    return onsetD <= nowD || onsetD.toDateString() === nowD.toDateString();
                });
                if (!feats.length) { activeAlert = null; renderBottomBar(); return; }

                // in-effect alerts outrank pending ones, then by severity
                const now = Date.now();
                const startOf = f => f.properties.onset ? new Date(f.properties.onset).getTime() : 0;
                const rank = { Extreme: 4, Severe: 3, Moderate: 2, Minor: 1, Unknown: 0 };
                feats.sort((a, b) => {
                    const aPending = startOf(a) > now, bPending = startOf(b) > now;
                    if (aPending !== bPending) return aPending ? 1 : -1;
                    return (rank[b.properties.severity] || 0) - (rank[a.properties.severity] || 0);
                });
                const p = feats[0].properties;
                const cls = { Extreme: 'extreme', Severe: 'severe', Moderate: 'moderate', Minor: 'minor' }[p.severity] || 'moderate';

                // `expires` is when the message needs refreshing, not when the event ends - prefer `ends`
                const fmt = d => d.toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
                const onset = p.onset ? new Date(p.onset) : null;
                const end = p.ends ? new Date(p.ends) : (p.expires ? new Date(p.expires) : null);
                let text = '⚠ ' + p.event;
                if (onset && onset.getTime() > now) {
                    text += ' · ' + fmt(onset) + (end ? ' – ' + fmt(end) : '');   // hasn't started yet
                } else if (end) {
                    text += ' until ' + fmt(end);
                }
                if (feats.length > 1) text += `  (+${feats.length - 1} more)`;

                const when = onset && onset.getTime() > now
                    ? `${fmt(onset)} – ${end ? fmt(end) : 'unknown'}`
                    : (end ? `In effect until ${fmt(end)}` : 'In effect now');
                activeAlert = { text, cls, detail: { event: p.event, when, area: p.areaDesc, description: p.description, instruction: p.instruction } };
                renderBottomBar();
            } catch (e) { console.error('NWS alerts error:', e); }  // keep last known state
        }

        async function fetchAQI() {
            try {
                const r = await fetch(`https://api.purpleair.com/v1/sensors/${CONFIG.PURPLEAIR_SENSOR_ID}?fields=pm2.5_10minute`, { headers: { 'X-API-Key': CONFIG.PURPLEAIR_API_KEY } });
                const d = await r.json();
                if (d.sensor && d.sensor.stats) {
                    const pm25 = d.sensor.stats['pm2.5_10minute'];
                    const aqi = pm25ToAQI(pm25);
                    updateAQIDisplay(aqi);
                }
            } catch (e) { console.error('PurpleAir error:', e); updateAQIDisplay(null, 'Error'); }
        }

        function pm25ToAQI(pm) {
            const bp = [[0,12,0,50],[12.1,35.4,51,100],[35.5,55.4,101,150],[55.5,150.4,151,200],[150.5,250.4,201,300],[250.5,350.4,301,400],[350.5,500.4,401,500]];
            for (const [pl,ph,al,ah] of bp) if (pm >= pl && pm <= ph) return Math.round((ah-al)/(ph-pl)*(pm-pl)+al);
            return 500;
        }

        function updateAQIDisplay(aqi, override = null) {
            const el = document.getElementById('aqi-value'), st = document.getElementById('aqi-status');
            if (aqi === null) { el.textContent = '--'; st.textContent = override || 'Unavailable'; st.className = 'aqi-status'; return; }
            el.textContent = aqi; st.className = 'aqi-status';
            const [status, cls] = aqi <= 50 ? ['Good','aqi-good'] : aqi <= 100 ? ['Moderate','aqi-moderate'] : aqi <= 150 ? ['Unhealthy for Sensitive Groups','aqi-sensitive'] : aqi <= 200 ? ['Unhealthy','aqi-unhealthy'] : aqi <= 300 ? ['Very Unhealthy','aqi-very-unhealthy'] : ['Hazardous','aqi-hazardous'];
            st.textContent = override || status; st.classList.add(cls);
        }

        // Touch screens leave chart tooltips stuck open; clear them on outside taps
        // and auto-hide a few seconds after any tap on a chart
        let tooltipTimer = null;
        function clearChartTooltips() {
            [forecastChart, pressureChart, weekChart].forEach(c => {
                if (c && c.getActiveElements().length) {
                    c.setActiveElements([]);
                    c.tooltip.setActiveElements([], { x: 0, y: 0 });
                    c.update('none');
                }
            });
        }
        function enableTooltipDismiss() {
            document.addEventListener('pointerdown', (e) => {
                clearTimeout(tooltipTimer);
                if (e.target.tagName === 'CANVAS') {
                    tooltipTimer = setTimeout(clearChartTooltips, 6000);
                } else {
                    clearChartTooltips();
                }
            });
        }

        // Sunrise/sunset from lat/lon (NOAA solar position algorithm) - no API needed
        function computeSunTimes(date, lat, lon) {
            const rad = Math.PI / 180, dayMs = 86400000, J1970 = 2440588, J2000 = 2451545;
            const toDays = d => d.valueOf() / dayMs - 0.5 + J1970 - J2000;
            const fromJulian = j => new Date((j + 0.5 - J1970) * dayMs);
            const e = rad * 23.4397;
            const lw = rad * -lon, phi = rad * lat;
            const d = toDays(date);
            const n = Math.round(d - 0.0009 - lw / (2 * Math.PI));
            const ds = 0.0009 + lw / (2 * Math.PI) + n;
            const M = rad * (357.5291 + 0.98560028 * ds);
            const L = M + rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) + rad * 102.9372 + Math.PI;
            const dec = Math.asin(Math.sin(e) * Math.sin(L));
            const Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
            const h0 = -0.833 * rad;
            const cosW = (Math.sin(h0) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec));
            if (cosW > 1 || cosW < -1) return null;  // polar day/night
            const w0 = Math.acos(cosW);
            const Jset = J2000 + (0.0009 + (w0 + lw) / (2 * Math.PI) + n) + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
            return { sunrise: fromJulian(Jnoon - (Jset - Jnoon)), sunset: fromJulian(Jset) };
        }

        function updateSunDisplay() {
            const now = new Date();
            const t = computeSunTimes(now, CONFIG.STATION_LAT, CONFIG.STATION_LON);
            if (!t) return;
            const fmt = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            document.getElementById('sunrise-time').textContent = fmt(t.sunrise);
            document.getElementById('sunset-time').textContent = fmt(t.sunset);

            // Walk the dot along the arc: 0 at sunrise, 1 at sunset; dimmed at the ends overnight
            const frac = (now - t.sunrise) / (t.sunset - t.sunrise);
            const path = document.getElementById('sun-path');
            const dot = document.getElementById('sun-dot');
            const pt = path.getPointAtLength(path.getTotalLength() * Math.min(1, Math.max(0, frac)));
            dot.setAttribute('cx', pt.x);
            dot.setAttribute('cy', pt.y);
            const isDay = frac >= 0 && frac <= 1;
            dot.setAttribute('opacity', isDay ? 1 : 0.3);
            dot.setAttribute('fill', isDay ? '#ffd166' : '#9aa7ff');
        }

        // Moon illuminated fraction + waxing/waning from sun/moon ecliptic positions
        function moonIllumination(date) {
            const rad = Math.PI / 180;
            const d = date.valueOf() / 86400000 - 0.5 + 2440588 - 2451545;  // days since J2000
            const e = rad * 23.4397;

            const M = rad * (357.5291 + 0.98560028 * d);
            const Ls = M + rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) + rad * 102.9372 + Math.PI;
            const sRa = Math.atan2(Math.sin(Ls) * Math.cos(e), Math.cos(Ls));
            const sDec = Math.asin(Math.sin(e) * Math.sin(Ls));

            const L = rad * (218.316 + 13.176396 * d);   // moon mean longitude
            const Mm = rad * (134.963 + 13.064993 * d);  // moon mean anomaly
            const F = rad * (93.272 + 13.229350 * d);    // mean distance of moon from node
            const lon = L + rad * 6.289 * Math.sin(Mm);
            const lat = rad * 5.128 * Math.sin(F);
            const dist = 385001 - 20905 * Math.cos(Mm);
            const mRa = Math.atan2(Math.sin(lon) * Math.cos(e) - Math.tan(lat) * Math.sin(e), Math.cos(lon));
            const mDec = Math.asin(Math.sin(lat) * Math.cos(e) + Math.cos(lat) * Math.sin(e) * Math.sin(lon));

            const sdist = 149598000;
            const phi = Math.acos(Math.sin(sDec) * Math.sin(mDec) + Math.cos(sDec) * Math.cos(mDec) * Math.cos(sRa - mRa));
            const inc = Math.atan2(sdist * Math.sin(phi), dist - sdist * Math.cos(phi));
            const angle = Math.atan2(Math.cos(sDec) * Math.sin(sRa - mRa), Math.sin(sDec) * Math.cos(mDec) - Math.cos(sDec) * Math.sin(mDec) * Math.cos(sRa - mRa));
            const phase = 0.5 + 0.5 * inc * (angle < 0 ? -1 : 1) / Math.PI;  // 0 new, 0.5 full
            return { fraction: (1 + Math.cos(inc)) / 2, phase, waxing: phase < 0.5 };
        }

        function updateMoonPhase() {
            const m = moonIllumination(new Date());
            const k = m.fraction, waxing = m.waxing;
            const R = 10.5;
            const a = R * (2 * k - 1);          // terminator semi-axis; <0 crescent, >0 gibbous
            const sweep = a >= 0 ? 1 : 0;
            const path = `M 0 ${-R} A ${R} ${R} 0 0 1 0 ${R} A ${Math.abs(a)} ${R} 0 0 ${sweep} 0 ${-R} Z`;
            const el = document.getElementById('moon-lit');
            el.setAttribute('d', path);
            el.setAttribute('transform', waxing ? '' : 'scale(-1,1)');  // mirror for waning
        }

        // Radar overlay: last hour of NEXRAD (IEM, weather.gov colours) or RainViewer (dark look),
        // looped over a CARTO basemap centred on the station. Leaflet loads lazily on first open.
        const RADAR_STYLES = [
            { name: 'Classic', source: 'iem', base: 'https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', opacity: 0.8, marker: '#c0392b' },
            { name: 'Dark', source: 'rainviewer', scheme: 6, base: 'https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', opacity: 0.85, marker: '#74ebd5' }
        ];
        let radarMap = null, radarBase = null, radarMarker = null, radarLayers = [], radarTimes = [],
            radarTimer = null, radarIdx = 0, radarStyle = 0, radarPlaying = true;

        function loadAsset(tag, attrs) {
            return new Promise((resolve, reject) => {
                const el = document.createElement(tag);
                Object.assign(el, attrs);
                el.onload = resolve;
                el.onerror = reject;
                document.head.appendChild(el);
            });
        }

        async function openRadar() {
            document.getElementById('radar-modal').classList.add('open');
            try {
                if (typeof L === 'undefined') {
                    loadAsset('link', { rel: 'stylesheet', href: 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css' });
                    await loadAsset('script', { src: 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js' });
                }
                if (!radarMap) {
                    radarMap = L.map('radar-map').setView([CONFIG.STATION_LAT, CONFIG.STATION_LON], 8);
                    // radar tiles live in their own pane so the fade is applied once to the
                    // composited image - per-layer opacity double-composites tile edges and
                    // draws hairline seams on retina screens. 350 keeps it under the marker pane.
                    radarMap.createPane('radarPane');
                    radarMap.getPane('radarPane').style.zIndex = 350;
                } else {
                    radarMap.invalidateSize();
                }
                await applyRadarStyle();
            } catch (e) {
                console.error('Radar error:', e);
                document.getElementById('radar-time').textContent = 'Radar unavailable';
            }
        }

        async function applyRadarStyle() {
            const s = RADAR_STYLES[radarStyle];
            document.getElementById('radar-style').textContent = 'Style: ' + s.name;
            // the dBZ legend only describes the NEXRAD ramp
            document.getElementById('radar-legend').style.display = s.source === 'iem' ? '' : 'none';

            if (radarBase) radarMap.removeLayer(radarBase);
            radarBase = L.tileLayer(s.base, { maxZoom: 12, attribution: '&copy; OpenStreetMap, &copy; CARTO' }).addTo(radarMap);
            radarBase.bringToBack();

            radarLayers.forEach(l => radarMap.removeLayer(l));
            radarLayers = [];
            radarTimes = [];

            if (s.source === 'iem') {
                // IEM serves time-lagged NEXRAD composites in 5-minute steps back to 55 min
                for (let m = 55; m >= 0; m -= 5) {
                    const suffix = m === 0 ? '' : `-m${String(m).padStart(2, '0')}m`;
                    radarLayers.push(L.tileLayer(`https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913${suffix}/{z}/{x}/{y}.png`,
                        { pane: 'radarPane', opacity: 0, maxZoom: 12, attribution: 'NEXRAD: Iowa State IEM' }).addTo(radarMap));
                    radarTimes.push(new Date(Date.now() - m * 60000));
                }
            } else {
                const r = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                const d = await r.json();
                ((d.radar && d.radar.past) || []).slice(-7).forEach(f => {
                    radarLayers.push(L.tileLayer(`${d.host}${f.path}/512/{z}/{x}/{y}/${s.scheme}/1_1.png`,
                        { pane: 'radarPane', opacity: 0, maxZoom: 12, tileSize: 512, zoomOffset: -1, attribution: 'RainViewer' }).addTo(radarMap));
                    radarTimes.push(new Date(f.time * 1000));
                });
            }

            if (radarMarker) radarMap.removeLayer(radarMarker);
            radarMarker = L.circleMarker([CONFIG.STATION_LAT, CONFIG.STATION_LON],
                { radius: 5, color: s.marker, weight: 2, fillColor: s.marker, fillOpacity: 0.9 }).addTo(radarMap);

            startRadarLoop(s.opacity);
        }

        function showRadarFrame(i) {
            radarIdx = i;
            radarLayers.forEach((l, j) => l.setOpacity(j === i ? 1 : 0));  // pane carries the fade
            const t = radarTimes[i];
            if (t) document.getElementById('radar-time').textContent = t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            document.getElementById('radar-slider').value = i;
        }

        function setRadarPlaying(on) {
            radarPlaying = on;
            document.getElementById('radar-play').textContent = on ? '⏸' : '▶';
            clearInterval(radarTimer);
            radarTimer = on ? setInterval(() => showRadarFrame((radarIdx + 1) % radarLayers.length), 500) : null;
        }

        function startRadarLoop(opacity) {
            radarMap.getPane('radarPane').style.opacity = opacity;
            if (!radarLayers.length) { clearInterval(radarTimer); document.getElementById('radar-time').textContent = 'No radar frames'; return; }
            document.getElementById('radar-slider').max = radarLayers.length - 1;
            showRadarFrame(0);
            setRadarPlaying(true);
        }

        // Standard NWS NEXRAD reflectivity ramp (dBZ)
        const DBZ_RAMP = [
            [5, '#04e9e7'], [10, '#019ff4'], [15, '#0300f4'], [20, '#02fd02'], [25, '#01c501'], [30, '#008e00'],
            [35, '#fdf802'], [40, '#e5bc00'], [45, '#fd9500'], [50, '#fd0000'], [55, '#d40000'], [60, '#bc0000'],
            [65, '#f800fd'], [70, '#9854c6'], [75, '#fdfdfd']
        ];

        function buildRadarLegend() {
            const bars = DBZ_RAMP.map(([, c]) => `<i style="background:${c}"></i>`).join('');
            document.getElementById('radar-legend').innerHTML =
                `<div class="radar-legend-title">Reflectivity (dBZ)</div>
                 <div class="radar-legend-bar">${bars}</div>
                 <div class="radar-legend-labels"><span>5</span><span>20</span><span>35</span><span>50</span><span>65</span><span>75+</span></div>
                 <div class="radar-legend-words"><span>light</span><span>moderate</span><span>heavy</span><span>hail</span></div>`;
        }

        function closeRadar() {
            clearInterval(radarTimer);
            radarTimer = null;
            document.getElementById('radar-modal').classList.remove('open');
        }

        function enableRadar() {
            buildRadarLegend();
            document.getElementById('radar-btn').addEventListener('click', (e) => {
                e.stopPropagation();  // don't also toggle the alert bar
                openRadar();
            });
            document.getElementById('radar-close').addEventListener('click', closeRadar);
            document.getElementById('radar-play').addEventListener('click', () => {
                if (radarLayers.length) setRadarPlaying(!radarPlaying);
            });
            // dragging the slider pauses the loop and scrubs to that frame
            document.getElementById('radar-slider').addEventListener('input', (e) => {
                if (!radarLayers.length) return;
                if (radarPlaying) setRadarPlaying(false);
                showRadarFrame(+e.target.value);
            });
            document.getElementById('radar-style').addEventListener('click', () => {
                radarStyle = (radarStyle + 1) % RADAR_STYLES.length;
                applyRadarStyle();
            });
        }

        function enableFullscreen() {
            document.addEventListener('dblclick', () => {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
                else document.exitFullscreen();
            });
        }

        async function init() {
            initForecastChart();
            initPressureChart();
            initWeekChart();
            enableFullscreen();
            enableTooltipDismiss();
            enableAlertUI();
            enableRadar();
            updateSunDisplay();
            updateMoonPhase();
            setInterval(updateSunDisplay, 60 * 1000);
            setInterval(updateMoonPhase, 60 * 60 * 1000);
            await fetchMesoWestData();
            await fetchNWSForecast();
            await fetchAlerts();
            await fetchAQI();
            setInterval(fetchMesoWestData, CONFIG.UPDATE_INTERVAL_WEATHER);
            setInterval(fetchNWSForecast, CONFIG.UPDATE_INTERVAL_FORECAST);
            setInterval(fetchAlerts, CONFIG.UPDATE_INTERVAL_FORECAST);
            setInterval(fetchAQI, CONFIG.UPDATE_INTERVAL_AQI);
            
            // Refresh data when page becomes visible again (Safari suspends timers)
            document.addEventListener('visibilitychange', async () => {
                if (document.visibilityState === 'visible') {
                    await fetchMesoWestData();
                    await fetchNWSForecast();
                    await fetchAlerts();
                    await fetchAQI();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
